name: Build mat-only desktop

on:
  push:
    branches: [codex/mat-only-sizes]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: MatVisionStudio-MatOnly-0.1.10-Windows-x64
          path: |
            src-tauri/target/release/matvision-studio.exe
            docs/licenses/
          retention-days: 14
