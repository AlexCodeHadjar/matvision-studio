name: Quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_gpu_checks:
        description: 'Run historical browser baselines and native UI workflow (not physical-photo GPU acceptance)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fixtures
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  browser:
    if: github.event_name == 'workflow_dispatch' && inputs.full_gpu_checks
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - run: pnpm test:fixtures
      - run: pnpm test:browser
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-evidence
          path: test-results/

  native:
    if: github.event_name == 'workflow_dispatch' && inputs.full_gpu_checks
    needs: frontend
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fixtures
      - run: pnpm tauri build --no-bundle
      - run: pnpm test:native
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: native-evidence
          path: test-results/native/
