[package]
name = "matvision-studio"
version = "0.1.8"
description = "MatVision Studio desktop print visualization"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "matvision_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
base64 = "=0.23.1"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "=0.17.2"
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
