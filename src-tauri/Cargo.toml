[package]
name = "matvision-studio"
version = "0.1.0"
description = "MatVision Studio desktop print visualization"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
name = "matvision_studio_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
